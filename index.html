<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моё расписание</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<style>
    :root {
        --bg: #0f1115;
        --bg-soft: #151821;
        --card: #191d28;
        --card-border: #262b3a;
        --text: #e8eaf0;
        --text-dim: #9aa1b2;
        --text-faint: #5d6476;
        --accent: #4f8cff;
        --accent-soft: rgba(79, 140, 255, .14);
        --now: #2dd4bf;
        --now-soft: rgba(45, 212, 191, .12);
        --chips-row: #222738;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        padding: 24px 20px 60px;
    }

    .wrap { max-width: 1100px; margin: 0 auto; }
    main { margin-top: 22px; }

    /* ---------- Шапка ---------- */
    header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
    }
    h1 { font-size: 26px; font-weight: 650; letter-spacing: .2px; }
    h1 .group { color: var(--text-dim); font-weight: 500; }
    .week-badge {
        margin-left: auto;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid rgba(79, 140, 255, .3);
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
    }
    .countdown-pill {
        background: var(--now-soft);
        color: var(--now);
        border: 1px solid rgba(45, 212, 191, .3);
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        transition: background .3s, color .3s, border-color .3s;
    }
    .countdown-pill.started {
        background: rgba(251, 191, 36, .15);
        color: #fcd34d;
        border-color: rgba(251, 191, 36, .4);
        animation: pulse 2s ease-in-out infinite;
    }

    /* ---------- Панель управления ---------- */
    .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        margin-bottom: 0;
    }
    .chip-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        background: var(--bg-soft);
        border: 1px solid var(--card-border);
        padding: 6px;
        border-radius: 12px;
    }
    .chip-row .label {
        align-self: center;
        color: var(--text-faint);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .8px;
        padding: 0 6px;
        user-select: none;
    }
    .chip {
        padding: 7px 14px;
        border-radius: 9px;
        border: none;
        background: transparent;
        color: var(--text-dim);
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: background .15s, color .15s, transform .12s;
        white-space: nowrap;
    }
    .chip:hover { color: var(--text); background: var(--chips-row); }
    .chip:active { transform: scale(.94); }
    .chip.active { background: var(--accent); color: #fff; }
    .chip.today-hint { position: relative; }
    .chip.today-hint::after {
        content: "";
        position: absolute;
        bottom: 3px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--now);
    }
    .chip.active.today-hint::after { background: #fff; }

    /* --- выпадающий список всех групп --- */
    #groupRow .group-picker { position: relative; display: inline-flex; }
    .picker-list {
        position: absolute; top: calc(100% + 8px); left: 0; z-index: 60;
        width: 290px; max-width: 86vw;
        background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, .55);
        padding: 9px; display: none;
    }
    .picker-list.open { display: block; animation: picker-in .18s ease both; }
    @keyframes picker-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
    .picker-search {
        width: 100%; box-sizing: border-box; margin-bottom: 8px;
        background: var(--bg-soft); border: 1px solid var(--card-border); border-radius: 9px;
        color: var(--text); font: inherit; font-size: 14px; padding: 8px 11px; outline: none;
    }
    .picker-search:focus { border-color: var(--accent); }
    .picker-list-x { display: flex; flex-direction: column; gap: 3px; max-height: 300px; overflow: auto; }
    .picker-item {
        all: unset; display: block; padding: 7px 10px; border-radius: 8px;
        color: var(--text-dim); font-size: 14px; cursor: pointer;
    }
    .picker-item:hover { background: var(--accent-soft); color: var(--text); }
    .picker-item.active { color: var(--accent); font-weight: 600; }
    .picker-empty { color: var(--text-faint); font-size: 13px; text-align: center; padding: 10px 0; }
    .group-picker .chev { font-size: 10px; transition: transform .25s ease; }
    .group-picker.open .chev { transform: rotate(180deg); }

    /* ---------- Плашка первого запуска «Выберите группу» ---------- */
    .gate-overlay {
        position: fixed; inset: 0; z-index: 80;
        background: rgba(5, 7, 12, .66);
        backdrop-filter: blur(4px);
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
        animation: fade-in .2s ease both;
    }
    .gate-card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 24px 22px 18px;
        width: min(100%, 430px);
        animation: pop-in .25s ease both;
    }
    .gate-emoji { font-size: 30px; }
    .gate-title { font-size: 19px; font-weight: 650; margin-top: 10px; }
    .gate-sub { color: var(--text-dim); font-size: 13.5px; line-height: 1.4; margin-top: 6px; }
    .gate-search {
        width: 100%; box-sizing: border-box; margin-top: 14px;
        background: var(--bg-soft); border: 1px solid var(--card-border); border-radius: 10px;
        color: var(--text); font: inherit; font-size: 14px; padding: 9px 12px; outline: none;
    }
    .gate-search:focus { border-color: var(--accent); }
    .gate-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        margin-top: 12px;
        max-height: 42vh;
        overflow-y: auto;
    }
    .gate-btn {
        all: unset; cursor: pointer; box-sizing: border-box;
        padding: 10px 6px; text-align: center;
        border-radius: 10px;
        background: var(--bg-soft);
        border: 1px solid var(--card-border);
        color: var(--text-dim);
        font-size: 13px; font-weight: 600;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        transition: background .15s, color .15s, border-color .15s, transform .12s;
    }
    .gate-btn:hover { color: var(--accent); border-color: rgba(79, 140, 255, .4); background: var(--accent-soft); }
    .gate-btn:active { transform: scale(.96); }
    .gate-note { color: var(--text-faint); font-size: 12px; margin-top: 14px; text-align: center; }
    .gate-skip {
        all: unset; cursor: pointer;
        color: var(--text-faint); font-size: 12.5px;
        text-decoration: underline dashed;
        display: block; margin: 8px auto 0; padding: 4px 10px;
    }
    .gate-skip:hover { color: var(--text-dim); }

    /* ---------- Блок «Настройки» ---------- */
    .settings-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 16px;
        background: var(--bg-soft);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
        transition: color .15s, border-color .15s, background .15s;
    }
    .settings-toggle:hover { color: var(--text); border-color: #353c50; }
    .settings-toggle.open { color: var(--accent); border-color: rgba(79, 140, 255, .4); }
    .settings-toggle .gear {
        display: inline-block;
        font-size: 15px;
        transition: transform .4s cubic-bezier(.2, .8, .3, 1.4);
    }
    .settings-toggle.open .gear { transform: rotate(120deg); }
    .settings-toggle .chev {
        font-size: 10px;
        transition: transform .3s ease;
    }
    .settings-toggle.open .chev { transform: rotate(180deg); }

    .settings-panel {
        display: grid;
        grid-template-rows: 0fr;          /* свёрнуто: плавное раскрытие через 1fr */
        opacity: 0;
        transform: translateY(-6px);
        visibility: hidden;
        transition: grid-template-rows .35s ease, opacity .22s ease, transform .3s ease,
                    visibility 0s linear .35s;
    }
    .settings-panel.open {
        grid-template-rows: 1fr;
        margin-top: 12px;
        opacity: 1;
        transform: none;
        visibility: visible;
        transition: grid-template-rows .35s ease, opacity .28s ease .08s,
                    transform .32s ease .08s, visibility 0s;
    }
    .settings-inner {
        overflow: hidden;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* ---------- День (одиночный вид) ---------- */
    .day-title {
        font-size: 21px;
        font-weight: 650;
        margin: 6px 0 18px;
    }
    .day-title .date { color: var(--text-dim); font-weight: 500; font-size: 17px; }

    .slot { display: grid; grid-template-columns: 130px 1fr; gap: 14px; margin-bottom: 12px; }
    .slot-time {
        text-align: right;
        color: var(--text-dim);
        font-size: 14px;
        font-weight: 600;
        padding-top: 14px;
        font-variant-numeric: tabular-nums;
        white-space: pre-line;
    }
    .slot-time .status {
        display: block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .5px;
    }
    .slot-time .status.now { color: var(--now); }
    .slot-time .status.past { color: var(--text-faint); }

    .lessons { display: flex; flex-direction: column; gap: 8px; }
    .lesson {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 13px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        transition: border-color .15s, transform .18s, box-shadow .18s;
    }
    .lesson:hover {
        border-color: #353c50;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
    }
    .lesson.now {
        border-color: rgba(45, 212, 191, .5);
        background: linear-gradient(90deg, var(--now-soft), var(--card) 45%);
    }
    .now-pill {
        display: none;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        background: var(--now-soft);
        color: var(--now);
        border: 1px solid rgba(45, 212, 191, .35);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .5px;
        padding: 3px 9px;
        border-radius: 999px;
    }
    .now-pill::before {
        content: "";
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--now);
    }
    .lesson.now .now-pill { display: inline-flex; }

    .l-main { min-width: 0; flex: 1 1 220px; }
    .subject { font-weight: 600; line-height: 1.35; }
    .teacher {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        color: var(--text-dim);
        font-size: 13px;
        margin-top: 3px;
    }

    /* ---------- Рейтинг преподавателей ---------- */
    .teacher-name {
        background: none;
        border: none;
        border-bottom: 1px dashed rgba(154, 161, 178, .55);
        padding: 0;
        cursor: pointer;
        font-family: inherit;
        font-size: inherit;
        color: inherit;
        transition: color .15s, border-color .15s;
    }
    .teacher-name:hover { color: var(--accent); border-color: var(--accent); }
    .rating-chip {
        background: var(--chips-row);
        border: none;
        color: var(--now);
        padding: 2px 9px;
        border-radius: 6px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: transform .12s, background .15s, color .15s;
    }
    .rating-chip:hover { transform: translateY(-1px); background: #2a3044; }
    .rating-chip.voted { color: #fcd34d; }

    /* Окошко оценки */
    .rate-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(5, 7, 12, .62);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fade-in .2s ease both;
    }
    .rate-card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 22px 26px;
        width: calc(100% - 48px);
        max-width: 400px;
        animation: pop-in .25s ease both;
    }
    .rate-card h3 { font-size: 17px; font-weight: 650; line-height: 1.35; }
    .rate-sub { color: var(--text-faint); font-size: 13px; margin-top: 6px; }
    .rate-stats { color: var(--now); font-weight: 600; font-size: 14px; margin-top: 12px; }
    .rate-stars { display: flex; gap: 6px; margin-top: 14px; }
    .rate-star {
        flex: 1;
        padding: 10px 0;
        font-family: inherit;
        font-size: 19px;
        background: var(--bg-soft);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        color: var(--text-dim);
        cursor: pointer;
        transition: transform .12s, color .15s, border-color .15s, background .15s;
    }
    .rate-star:hover {
        transform: translateY(-3px) scale(1.04);
        color: #fcd34d;
        border-color: rgba(251, 191, 36, .4);
        background: rgba(251, 191, 36, .08);
    }
    .rate-star.picked {
        color: #fcd34d;
        border-color: rgba(251, 191, 36, .5);
        background: rgba(251, 191, 36, .12);
    }
    .rate-note { color: var(--text-faint); font-size: 12.5px; margin-top: 10px; }
    .rate-input {
        width: 100%;
        margin-top: 14px;
        padding: 11px 14px;
        font-family: inherit;
        font-size: 14px;
        background: var(--bg-soft);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        color: var(--text);
        transition: border-color .15s;
    }
    .rate-input::placeholder { color: var(--text-faint); }
    .rate-input:focus { outline: none; border-color: var(--accent); }
    .rate-input.err {
        border-color: rgba(251, 113, 133, .6);
        animation: shake .3s ease;
    }
    .rate-stars.disabled { opacity: .45; pointer-events: none; }
    .rate-list {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--card-border);
        max-height: 170px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .rate-list-title {
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .6px;
        color: var(--text-faint);
        margin-bottom: 2px;
    }
    .rate-vote {
        display: flex;
        gap: 8px;
        align-items: baseline;
        font-size: 13px;
        color: var(--text-dim);
    }
    .rate-vote .score { color: #fcd34d; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rate-vote .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rate-vote.own .who { color: var(--now); }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25%      { transform: translateX(-5px); }
        75%      { transform: translateX(5px); }
    }
    .note { color: var(--text-faint); font-size: 12.5px; margin-top: 3px; }

    .l-badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .badge {
        font-size: 11.5px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 6px;
        white-space: nowrap;
    }
    .badge.type-lec { background: rgba(79, 140, 255, .15); color: #8db3ff; }
    .badge.type-lab { background: rgba(45, 212, 191, .13); color: #5fe0d0; }
    .badge.type-pra { background: rgba(251, 191, 36, .13); color: #fcd34d; }
    .badge.sub { background: var(--chips-row); color: var(--text-dim); }
    .badge.room { background: var(--chips-row); color: var(--text); font-variant-numeric: tabular-nums; }

    .empty-day {
        color: var(--text-dim);
        background: var(--bg-soft);
        border: 1px dashed var(--card-border);
        border-radius: 14px;
        padding: 26px;
        text-align: center;
        font-size: 14.5px;
    }

    /* ---------- Неделя ---------- */
    .week-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
    }
    .week-day {
        background: var(--bg-soft);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 14px;
    }
    .week-day.today { border-color: rgba(79, 140, 255, .45); }
    .week-day h3 {
        font-size: 15.5px;
        font-weight: 650;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .today-tag {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .5px;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 2px 8px;
        border-radius: 999px;
    }
    .glance { display: flex; flex-direction: column; gap: 6px; }
    .glance-item {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 10px;
        align-items: baseline;
    }
    .glance-item.now .glance-time { color: var(--now); }
    .glance-item.now .glance-text { color: var(--now); }
    .glance-time {
        color: var(--text-faint);
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: right;
    }
    .glance-text { font-size: 13.5px; line-height: 1.35; }
    .glance-text .x { color: var(--text-faint); }

    /* ---------- Анимации ---------- */
    @keyframes fade-in {
        from { opacity: 0; }
    }
    @keyframes rise-in {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
    }
    @keyframes pop-in {
        from { opacity: 0; transform: translateY(14px) scale(.985); }
        to   { opacity: 1; transform: none; }
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: .3; }
    }

    /* тихое обновление по таймеру — без повторных анимаций появления */
    main.quiet * { animation: none !important; }

    .day-title { animation: rise-in .35s ease both; }
    .slot      { animation: pop-in .32s ease both; animation-delay: calc(var(--i, 0) * 45ms); }
    .lesson    { animation: pop-in .3s ease both; animation-delay: calc(var(--i, 0) * 45ms + var(--d, 0ms)); }
    .empty-day { animation: pop-in .32s ease both; }
    .week-day  { animation: pop-in .35s ease both; animation-delay: calc(var(--i, 0) * 55ms); }
    .week-day:hover { border-color: #353c50; }
    .glance-item { animation: pop-in .3s ease both; animation-delay: calc(var(--i, 0) * 55ms + var(--d, 0ms)); }

    .chip.today-hint::after { animation: pulse 2.2s ease-in-out infinite; }
    .now-pill::before { animation: pulse 1.8s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: .01ms !important;
        }
    }
</style>

<body>
<div class="wrap">
    <header>
        <h1>Моё расписание <span class="group" id="groupLabel">— КСК-241о</span></h1>
        <div class="week-badge" id="weekBadge"></div>
        <div class="countdown-pill" id="countdownBadge" hidden></div>
    </header>

    <div class="controls">
        <div class="chip-row" id="viewsRow" role="tablist" aria-label="Вид"></div>
        <div class="chip-row" id="groupRow" role="group" aria-label="Группа">
            <span class="label">Группа</span>
        </div>
        <button class="settings-toggle" id="settingsToggle" aria-expanded="false" aria-controls="settingsPanel">
            <span class="gear">⚙️</span>
            <span>Настройки</span>
            <span class="chev">▼</span>
        </button>
    </div>

const DAY_INDEX = {}; DAYS.forEach((d, i) => DAY_INDEX[d] = i);

// Тип занятия определяется по префиксу названия — как в оригинале
function parseType(title) {
    if (title.startsWith("Лекционные занятия"))   return { type: "lec", label: "Лекция",     rest: title.slice("Лекционные занятия".length) };
    if (title.startsWith("Лабораторные занятия")) return { type: "lab", label: "Лаборатория", rest: title.slice("Лабораторные занятия".length) };
    if (title.startsWith("Практические занятия")) return { type: "pra", label: "Практика",   rest: title.slice("Практические занятия".length) };
    return { type: "pra", label: "Занятие", rest: title };
}

// Остаток названия разбираем на предмет, преподавателя "(Фамилия И. О.)" и примечание ("перевод …")
function parseRest(rest) {
    const m = rest.match(/^(.*?)\s*\(([^()]+)\)\s*(.*)$/s);
    if (!m) return { subject: rest.trim(), teacher: "", note: "" };
    return { subject: m[1].trim(), teacher: m[2].trim(), note: m[3].trim() };
}

const lessons = [];
function rebuildLessons() {
    lessons.length = 0;
    for (const [gid, group] of Object.entries(GROUPS)) {
        for (const line of group.raw.split("\n")) {
            const s = line.trim();
            if (!s) continue;
            const [dayName, timeIdx, pos, sub, room, , title] = s.split("|");
            const day = DAY_INDEX[dayName.trim()];
            if (day === undefined) continue;
            const type = parseType(title.trim());
            const info = parseRest(type.rest);
            lessons.push({
                g: gid,
                d: day, t: +timeIdx, pos: pos.trim(), sub: +sub, w: 0, /* week_only — сохранено, как в исходнике, на показ не влияет */
                room: room.trim() === "—" ? "" : room.trim(),
                title: title.trim(),
                subject: info.subject, teacher: info.teacher, note: info.note,
                type: type.type, typeLabel: type.label,
                key: gid + "-" + day + "-" + timeIdx + "-" + pos.trim() + "-" + sub
            });
        }
    }
}
rebuildLessons();

/* Динамическое расписание (schedule.json рядом со страницей) — генерируется
   GitHub Actions из XLS-файлов cchgeu.ru (groups 24-го набора).
   Формат каждой строки совпадает со статикой, так что всё работает без правок рендера. */
function applyScheduleData(data) {
    if (!data || !data.groups) return;
    let added = 0;
    for (const [code, info] of Object.entries(data.groups)) {
        if (!info || !Array.isArray(info.lessons) || !info.lessons.length) continue;
        GROUPS[code] = { code, raw: info.lessons.join("\n") };
        added++;
    }
    if (!added) return;
    rebuildLessons();
    // отложенный выбор динамической группы — восстанавливаем именно его
    if (state.gPending && GROUPS[state.gPending]) {
        state.g = state.gPending;
        state.gPending = null;
    }
    if (!GROUPS[state.g]) state.g = "ksk";
    if (state.sub > 0 && !subsOfGroup(state.g).includes(state.sub)) state.sub = 0;
    buildSubs();
    buildGroups();
    if (gateRefresh) gateRefresh();   // список в открытой плашке первого запуска
    render(false);
}

     2) SQL Editor → вставить SQL таблицы → Run;

    url: "https://fxvpwwnsynhucrvmssgt.supabase.co",   // Project URL — вписан
    key: "sb_publishable_gcSIw_ItyVvn6sM4y_uFgw_e3TNwbTA"   // publishable ключ — вписан
};

const RATINGS_STORE_KEY = "teacher-ratings";

// Заголовки запросов. Новый формат ключей (sb_publishable_...) идёт только
// в заголовке apikey; старый JWT-ключ anon (начинается с eyJ) — и в Bearer.
function supaHeaders(extra) {
    const h = { apikey: RATINGS_DB.key };
    if (!RATINGS_DB.key.startsWith("sb_")) h.Authorization = "Bearer " + RATINGS_DB.key;
    return Object.assign(h, extra || {});
}

// GET-запрос к таблице оценок
function supaGet(query) {
    return fetch(RATINGS_DB.url + "/rest/v1/rating_votes" + query, {
        headers: supaHeaders()
    }).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
    });
}

const RATINGS = {
    mode: (RATINGS_DB.url && RATINGS_DB.key) ? "cloud" : "local",   // общий / резервный
    offline: false,          // облако настроено, но связи сейчас нет
    cache: {},               // [ключ учителя]: {count, avg} — агрегаты из облака
    _norm(t) { return t.replace(/\s+/g, " ").trim(); },
    load() {
        return Object.assign({ votes: {}, my: {}, myName: "" },
            JSON.parse(localStorage.getItem(RATINGS_STORE_KEY) || "{}"));
    },
    save(data) { localStorage.setItem(RATINGS_STORE_KEY, JSON.stringify(data)); },

    // Среднее и число голосов. В облаке — из закэшированных данных, локально — свои.
    average(teacher) {
        const key = RATINGS._norm(teacher);
        if (RATINGS.mode === "cloud") {
            const c = RATINGS.cache[key];
            return c ? { count: c.count, avg: c.avg } : { count: 0, avg: 0 };
        }
        const votes = RATINGS.load().votes[key] || {};
        let sum = 0, count = 0;
        for (const s in votes) { sum += s * votes[s]; count += votes[s]; }
        return count ? { count, avg: sum / count } : { count: 0, avg: 0 };
    },
    myVote(teacher) { return RATINGS.load().my[RATINGS._norm(teacher)] || 0; },
    myName() { return RATINGS.load().myName || ""; },

    // Обновить агрегаты из облака. При ошибке связи — молча переходим в локальный вид.
    async fetchAll() {
        if (RATINGS.mode !== "cloud") return;
        try {
            const rows = await supaGet("?select=teacher,score&limit=2000");
            const agg = {};
            for (const r of rows) {
                const k = String(r.teacher).trim();
                if (!agg[k]) agg[k] = { sum: 0, count: 0 };
                agg[k].sum += r.score;
                agg[k].count += 1;
            }
            const cache = {};
            for (const k in agg) cache[k] = { count: agg[k].count, avg: agg[k].sum / agg[k].count };
            RATINGS.cache = cache;
            RATINGS.offline = false;
        } catch (e) {
            RATINGS.offline = true;
        }
    },

    // Голос. В облаке — запись с именем (одно имя = один голос, повтор — ошибка 409),
    // локально — гистограмма своих голосов, как раньше.
    async vote(teacher, score, name) {
        const key = RATINGS._norm(teacher);
        if (RATINGS.mode === "cloud" && !RATINGS.offline) {
            const r = await fetch(RATINGS_DB.url + "/rest/v1/rating_votes", {
                method: "POST",
                headers: supaHeaders({
                    "Content-Type": "application/json",
                    Prefer: "return=minimal"
                }),
                body: JSON.stringify({ teacher: key, voter_name: name, score: score })
            });
            if (!r.ok) {
                const err = new Error("HTTP " + r.status);
                if (r.status === 409) err.dup = true;   // это имя уже голосовало
                throw err;
            }
            await RATINGS.fetchAll();
        } else {
            const data = RATINGS.load();
            if (!data.votes[key]) data.votes[key] = {};
            const prev = data.my[key] || 0;
            if (prev) {
                data.votes[key][prev] = (data.votes[key][prev] || 1) - 1;
                if (!data.votes[key][prev]) delete data.votes[key][prev];
            }
            if (prev !== score) data.votes[key][score] = (data.votes[key][score] || 0) + 1;
            RATINGS.save(data);
        }
        const data = RATINGS.load();
        data.my[key] = score;
        data.myName = name;
        RATINGS.save(data);
    }
};

/* ══════════════════ ДАТЫ И ЧЁТНОСТЬ НЕДЕЛИ ══════════════════ */

const DAY_MS = 24 * 60 * 60 * 1000;
const WEEK_MS = 7 * DAY_MS;

// Полночь указанной даты (локальная)
function midnight(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    return d;
}

// Начало семестра: учебная неделя №1 = 31 августа 2026 (как в exe)
const SEMESTER_START = new Date(2026, 7, 31);

// Номер недели и её чётность для произвольной даты.
// Возвращаем 1 = числитель, 2 = знаменатель. До начала семестра — числитель.
function halfForDate(date) {
    const week = Math.floor((midnight(date) - SEMESTER_START) / WEEK_MS) + 1;
    if (week < 1) return { week, half: 1 };
    return { week, half: week % 2 === 1 ? 1 : 2 };
}

// Понедельник недели, в которую входит дата
function mondayOf(date) {
    const d = midnight(date);
    const shift = (d.getDay() + 6) % 7; // Вс=0 → 6
    return new Date(d.getTime() - shift * DAY_MS);
}

const TODAY = () => midnight(new Date());

// Название дня недели по дате: 0 = сегодня, 1 = завтра (как в exe)
function dayIndexFromDate(date) {
    return (date.getDay() + 6) % 7;
}

function formatDate(date) {
    return date.getDate() + " " + MONTHS[date.getMonth()];
}

/* ══════════════════ ВРЕМЯ (подсветка текущей пары) ══════════════════ */

function toMinutes(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    return h * 60 + m;
}
const SLOT_RANGES = TIMES.map(t => {
    const [a, b] = t.split(" - ");
    return { start: toMinutes(a.trim()), end: toMinutes(b.trim()) };
});

// Статус пары относительно времени: 'now' | 'past' | '' (только для сегодняшней даты)
function slotStatus(t, date) {
    if (midnight(date).getTime() !== TODAY().getTime()) return "";
    const now = new Date();
    const mins = now.getHours() * 60 + now.getMinutes();
    const r = SLOT_RANGES[t];
    if (mins >= r.start && mins < r.end) return "now";
    if (mins >= r.end) return "past";
    return "";
}

function isCorrectHalf(l, half) {
    if (half === 0) return true;          // показывать обе недели (не используется, но оставлено)
    if (l.pos === "TOP") return half === 1;
    if (l.pos === "BOTTOM") return half === 2;
    return true;
}

// Возвращает занятия дня с учётом выбранной подгруппы и чётности
function lessonsForDay(day, sub, half) {

        .filter(l => l.g === state.g && l.d === day && isCorrectHalf(l, half))
        .filter(l => sub === 0 || l.sub === 0 || l.sub === sub)

}

// Начало зимней сессии: 22 декабря 2026, первая пара в 08:30.
// Явное указание часа сделано, чтобы «полночь 22 декабря» не считалась сессией раньше времени.
const SESSION_START = new Date(2026, 11, 22, 8, 30, 0);

// Русские склонения: plural(61, ["день","дня","дней"]) → "дней"
function plural(n, forms) {
    if (n % 10 === 1 && n % 100 !== 11) return forms[0];
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return forms[1];
    return forms[2];
}
function nums(n, forms) { return n + " " + plural(n, forms); }

// Состояние отсчёта в любой момент времени.
// До сессии: { started:false, days, hours, minutes, seconds, text } —
// обрезаем величины, которые уже безнадёжно велики (не показываем "0 дней 15 часов", если завтра).
// После старта: { started:true, text:"Сессия началась!" }.
function winterSessionCountdown(now = new Date()) {
    const diff = SESSION_START - now;
    if (diff <= 0) return { started: true, days: 0, hours: 0, minutes: 0, seconds: 0, text: "Сессия началась!" };
    const days = Math.floor(diff / DAY_MS);
    const hours = Math.floor((diff % DAY_MS) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    /* Спокойный формат (выбрано при согласовании): пока до сессии далеко — дни и часы;
       без часов — только часы; в последний час — минуты; в последнюю минуту — секунды. */
    const parts = [];
    if (days > 0) {
        parts.push(nums(days, ["день", "дня", "дней"]));
        if (hours > 0) parts.push(nums(hours, ["час", "часа", "часов"]));
    } else if (hours > 0) {
        parts.push(nums(hours, ["час", "часа", "часов"]));
    } else if (minutes > 0) {
        parts.push(nums(minutes, ["минута", "минуты", "минут"]));
    } else {
        parts.push(nums(seconds, ["секунда", "секунды", "секунд"]));
    }
    return { started: false, days, hours, minutes, seconds, parts, text: "До зимней сессии: " + parts.join(" ") };
}

if (![0, 1, 2, 3].includes(state.sub)) state.sub = 0;   // 3 = третья п/г (бывает в XLS); проверка по группе позже

    state.gPending = state.g;

function saveState() {

    const g = state.gPending || state.g;

        { view: state.view, sub: state.sub, halfMode: state.halfMode, g, settingsOpen: state.settingsOpen }

        pickerItemsBox.appendChild(b);

    if (!shown) {
        const d = document.createElement("div");
        d.className = "picker-empty";
        d.textContent = "Не найдено";
        pickerItemsBox.appendChild(d);
    }

    skip.textContent = "Не сейчас";
    skip.addEventListener("click", () => {
        try { localStorage.setItem(GATE_KEY, "1"); } catch (e) {}
        gateClose();
    });

    const renderGateItems = () => {
        const q = (search.value || "").trim().toLowerCase();
        list.innerHTML = "";
        let shown = 0;
        const seenCodes = new Set();   // без дубликатов кодов (статические vs динамические)
        for (const id of Object.keys(GROUPS)) {
            const code = GROUPS[id].code;
            if (seenCodes.has(code)) continue;
            seenCodes.add(code);
            if (q && !code.toLowerCase().includes(q)) continue;
            shown++;
            const b = document.createElement("button");
            b.type = "button";
            b.className = "gate-btn";
            b.textContent = code;
            b.addEventListener("click", () => {
                try { localStorage.setItem(GATE_KEY, "1"); } catch (e) {}
                gateClose();                 // вершину закрыть ДО render() — чипы уже собраны
                pickGroup(id);
            });
            list.appendChild(b);
        }
        if (!shown) {
            const d = document.createElement("div");
            d.style.cssText = "grid-column:1/-1;text-align:center;color:var(--text-faint);font-size:13px;padding:10px 0;";
            d.textContent = "Не найдено";
            list.appendChild(d);
        }
    };
    // если schedule.json догрузится позже — список в открытой плашке обновится
    gateRefresh = renderGateItems;
    search.addEventListener("input", renderGateItems);
    renderGateItems();

    card.append(search, list, note, skip);
    gateOverlay.append(card);
    gateOverlay.addEventListener("click", e => { if (e.target === gateOverlay) skip.click(); });
    document.addEventListener("keydown", function esc(e) {
        if (gateOverlay && e.key === "Escape") { skip.click(); document.removeEventListener("keydown", esc); }
        if (!gateOverlay) document.removeEventListener("keydown", esc);
    });
    document.body.appendChild(gateOverlay);

    if (window.matchMedia("(hover: hover)").matches) search.focus();
}

function renderControls() {
    const todayIdx = dayIndexFromDate(TODAY());
    renderGroups();
    viewChips.forEach(chip => {
        const raw = chip.dataset.viewId;
        const id = /^\d$/.test(raw) ? +raw : raw;
        chip.classList.toggle("active", state.view === id);
        // помечаем точкой вкладку, соответствующую сегодняшнему дню
        const dayIdx = typeof id === "number" ? id : (id === "today" ? todayIdx : -1);
        chip.classList.toggle("today-hint", dayIdx === todayIdx);
    });
    subChips.forEach(chip => chip.classList.toggle("active", state.sub === +chip.dataset.sub));
    halfChips.forEach((chip, i) => chip.classList.toggle("active", state.halfMode === ["auto", 1, 2][i]));
}

function renderBadge() {
    const grp = GROUPS[state.g];
    $("#groupLabel").textContent = "— " + grp.code;
    document.title = "Моё расписание — " + grp.code;
    const { week, half } = halfForDate(TODAY());
    const names = { 1: "числитель", 2: "знаменатель" };
    $("#weekBadge").textContent =
        (week >= 1 ? week + "-я учебная неделя · " : "семестр ещё не начался · ") + names[half];

    // отсчёт до зимней сессии (бейдж рядом с неделей)
    const c = winterSessionCountdown();
    const ct = $("#countdownBadge");
    ct.hidden = false;
    ct.classList.toggle("started", c.started);
    ct.textContent = c.started ? "🎓 Сессия началась!" : "⏳ До сессии: " + c.parts.join(" ");
}

// --- кармашек вывода одного занятия
function lessonCard(l, isNow, delayMs = 0) {
    const div = document.createElement("div");
    div.className = "lesson" + (isNow ? " now" : "");
    div.style.setProperty("--d", delayMs + "ms");   // каскад появления внутри слота

    const m = document.createElement("div");
    m.className = "l-main";
    if (isNow) {
        const pill = document.createElement("span");
        pill.className = "now-pill";
        pill.textContent = "идёт сейчас";
        m.appendChild(pill);
    }
    const subj = document.createElement("div");
    subj.className = "subject";
    subj.textContent = l.subject;
    m.appendChild(subj);
    if (l.teacher) m.appendChild(teacherRow(l.teacher));
    if (l.note) {
        const n = document.createElement("div");
        n.className = "note";
        n.textContent = l.note;
        m.appendChild(n);
    }
    div.appendChild(m);

    const badges = document.createElement("div");
    badges.className = "l-badges";
    const addBadge = (cls, text) => {
        const b = document.createElement("span");
        b.className = "badge " + cls;
        b.textContent = text;
        badges.appendChild(b);
    };
    addBadge("type-" + l.type, l.typeLabel);
    if (l.sub) addBadge("sub", l.sub + "-я подгруппа");
    if (l.room) addBadge("room", "ауд. " + l.room);
    div.appendChild(badges);
    return div;
}

/* ── Строка преподавателя: кликабельная фамилия + плашка со средним рейтингом ── */
function teacherRow(teacher) {
    const { count, avg } = RATINGS.average(teacher);
    const row = document.createElement("div");
    row.className = "teacher";

    const name = document.createElement("button");
    name.className = "teacher-name";
    name.textContent = teacher;
    name.title = "Оценить преподавателя";
    name.addEventListener("click", () => openRatePopup(teacher));
    row.appendChild(name);

    const chip = document.createElement("button");
    chip.className = "rating-chip" + (RATINGS.myVote(teacher) ? " voted" : "");
    chip.textContent = count
        ? "★ " + (Math.round(avg * 10) / 10).toFixed(1) + " (" + count + ")"
        : "☆ нет оценок";
    chip.title = "Оценить преподавателя";
    chip.addEventListener("click", () => openRatePopup(teacher));
    row.appendChild(chip);

    return row;
}

/* ── Окошко оценки: обязательное имя + звёзды + кто и как голосовал ── */
let rateOverlay = null, rateEscHandler = null;
function closeRatePopup() {
    if (rateOverlay) { rateOverlay.remove(); rateOverlay = null; }
    if (rateEscHandler) {
        document.removeEventListener("keydown", rateEscHandler);
        rateEscHandler = null;
    }
}
function openRatePopup(teacher) {
    closeRatePopup();

    const overlay = document.createElement("div");
    overlay.className = "rate-overlay";
    overlay.addEventListener("click", e => { if (e.target === overlay) closeRatePopup(); });

    const card = document.createElement("div");
    card.className = "rate-card";
    overlay.appendChild(card);

    const h = document.createElement("h3");
    h.textContent = teacher;
    card.appendChild(h);

    const sub = document.createElement("div");
    sub.className = "rate-sub";
    sub.textContent = "Впишите своё имя и поставьте оценку — её увидят все, кто зайдёт на сайт.";
    card.appendChild(sub);

    const input = document.createElement("input");
    input.className = "rate-input";
    input.placeholder = "Ваше имя (обязательно)";
    input.maxLength = 40;
    input.value = RATINGS.myName();
    input.addEventListener("input", () => { input.classList.remove("err"); refresh(); });
    card.appendChild(input);

    // показать список голосовавших (из облака; локально — только свой голос)
    async function updateList() {
        card.querySelectorAll(".rate-list").forEach(n => n.remove());
        let items = [];
        if (RATINGS.mode === "cloud" && !RATINGS.offline) {
            try {
                const rows = await supaGet("?teacher=eq." + encodeURIComponent(RATINGS._norm(teacher))
                    + "&select=voter_name,score&order=created_at.desc&limit=50");
                items = rows.map(r => ({ name: r.voter_name, score: r.score }));
            } catch (e) { items = []; }
        } else if (RATINGS.myVote(teacher)) {
            items = [{ name: RATINGS.mode === "local" ? "вы (на этом устройстве)" : "", score: RATINGS.myVote(teacher) }];
        }
        if (items.length === 0) return;

        const list = document.createElement("div");
        list.className = "rate-list";
        const lt = document.createElement("div");
        lt.className = "rate-list-title";
        lt.textContent = "Кто и как оценил:";
        list.appendChild(lt);
        const myName = input.value.trim().toLowerCase();
        items.forEach(it => {
            const row = document.createElement("div");
            row.className = "rate-vote" + (it.name.toLowerCase() === myName ? " own" : "");
            const sc = document.createElement("span");
            sc.className = "score";
            sc.textContent = "★ " + it.score;
            row.appendChild(sc);
            if (it.name) {
                const w = document.createElement("span");
                w.className = "who";
                w.textContent = it.name;
                row.appendChild(w);
            }
            list.appendChild(row);
        });
        card.appendChild(list);
    }

    function refresh() {
        card.querySelectorAll(".rate-stats, .rate-stars, .rate-note").forEach(n => n.remove());

        const { count, avg } = RATINGS.average(teacher);
        const stats = document.createElement("div");
        stats.className = "rate-stats";
        stats.textContent = count
            ? "★ " + (Math.round(avg * 10) / 10).toFixed(1) + " из 5 · голосов: " + count
            : "Пока нет голосов — ваш будет первым!";
        card.appendChild(stats);

        const nameOk = input.value.trim().length >= 2;
        const stars = document.createElement("div");
        stars.className = "rate-stars" + (nameOk ? "" : " disabled");
        for (let s = 1; s <= 5; s++) {
            const b = document.createElement("button");
            b.className = "rate-star" + (RATINGS.myVote(teacher) === s ? " picked" : "");
            b.textContent = s;
            b.title = ["Плохо", "Так себе", "Нормально", "Хорошо", "Отлично"][s - 1];
            b.addEventListener("click", () => doVote(s));
            stars.appendChild(b);
        }
        card.appendChild(stars);

        const bits = [];
        if (RATINGS.mode === "local")
            bits.push("Общий рейтинг ещё не настроен: эта оценка сохранится только на вашем устройстве.");
        else if (RATINGS.myVote(teacher))
            bits.push("Ваша оценка учтена. У каждого имени — один голос за преподавателя.");
        if (bits.length) {
            const note = document.createElement("div");
            note.className = "rate-note";
            note.textContent = bits.join(" ");
            card.appendChild(note);
        }
    }

    async function doVote(score) {
        const name = input.value.replace(/\s+/g, " ").trim();
        if (name.length < 2) {                       // имя обязательно
            input.classList.remove("err");
            void input.offsetWidth;                  // перезапуск анимации shake
            input.classList.add("err");
            input.focus();
            return;
        }
        card.querySelectorAll(".rate-note").forEach(n => n.remove());
        try {
            await RATINGS.vote(teacher, score, name);
            render(false);                           // молча обновляем плашки у фамилий
            refresh();
            await updateList();
        } catch (e) {
            const msg = document.createElement("div");
            msg.className = "rate-note";
            msg.style.color = "rgba(251, 113, 133, .9)";
            msg.textContent = e.dup
                ? "Имя «" + name + "» уже голосовало за этого преподавателя — одно имя = один голос (можно добавить инициалы, например «Аня С.»)."
                : (RATINGS.mode === "cloud"
                    ? "Не получилось отправить оценку. Проверьте интернет и попробуйте ещё раз."
                    : "Не удалось сохранить оценку на устройстве.");
            card.appendChild(msg);
        }
    }
    refresh();
    if (RATINGS.mode === "cloud") updateList();

    document.body.appendChild(overlay);
    rateOverlay = overlay;
    rateEscHandler = e => { if (e.key === "Escape") closeRatePopup(); };
    document.addEventListener("keydown", rateEscHandler);
}

// --- вид одного дня
function renderDay(dayIdx, date) {
    const half = state.halfMode === "auto" ? halfForDate(date).half : state.halfMode;
    const dayLessons = lessonsForDay(dayIdx, state.sub, half);

    const title = document.createElement("div");
    title.className = "day-title";
    title.textContent = DAYS[dayIdx] + "  ";
    const dspan = document.createElement("span");
    dspan.className = "date";
    dspan.textContent = formatDate(date);
    title.appendChild(dspan);
    main.appendChild(title);

    if (dayLessons.length === 0) {
        const e = document.createElement("div");
        e.className = "empty-day";
        e.textContent = "Занятий на этот день для выбранного режима нет 🎉";
        main.appendChild(e);
        return;
    }

    const bySlot = {};
    dayLessons.forEach(l => (bySlot[l.t] = bySlot[l.t] || []).push(l));

    TIMES.forEach((time, t) => {
        const group = bySlot[t] || [];
        const status = group.length ? slotStatus(t, date) : "";
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.style.setProperty("--i", t);           // каскад появления слотов

        const st = document.createElement("div");
        st.className = "slot-time";
        st.textContent = time.replace(" - ", "\n— ");
        if (status) {
            const s = document.createElement("span");
            s.className = "status " + status;
            s.textContent = status === "now" ? "сейчас" : "прошло";
            st.appendChild(s);
        }
        slot.appendChild(st);

        const box = document.createElement("div");
        box.className = "lessons";
        if (group.length === 0) {
            box.innerHTML = '<div style="color:var(--text-faint);font-size:14px;padding:14px 2px;">—</div>';
        } else {
            group.forEach((l, j) => box.appendChild(lessonCard(l, status === "now", j * 60)));
        }
        slot.appendChild(box);
        main.appendChild(slot);
    });
}

// --- краткая карточка для вида «Неделя»
function glanceItem(l, isNow, delayMs = 0) {
    const item = document.createElement("div");
    item.className = "glance-item" + (isNow ? " now" : "");
    item.style.setProperty("--d", delayMs + "ms");  // каскад появления внутри дня
    const tm = document.createElement("div");
    tm.className = "glance-time";
    tm.textContent = TIMES[l.t].slice(0, 5);
    item.appendChild(tm);
    const tx = document.createElement("div");
    tx.className = "glance-text";
    tx.innerHTML = "";
    tx.append(l.subject);
    if (l.room) tx.append(" · " + l.room);
    if (l.sub) {
        const x = document.createElement("span");
        x.className = "x";
        x.textContent = " · " + l.sub + " подгр.";
        tx.appendChild(x);
    }
    item.appendChild(tx);
    return item;
}

// --- вид всей недели
function renderWeek() {
    const monday = mondayOf(TODAY());
    const { half } = halfForDate(TODAY());
    const activeHalf = state.halfMode === "auto" ? half : state.halfMode;
    const todayIdx = dayIndexFromDate(TODAY());

    const grid = document.createElement("div");
    grid.className = "week-grid";

    DAYS.forEach((name, i) => {
        const date = new Date(monday.getTime() + i * DAY_MS);
        const card = document.createElement("div");
        card.className = "week-day" + (i === todayIdx ? " today" : "");
        card.style.setProperty("--i", i);           // каскад появления дней недели

        const h = document.createElement("h3");
        h.textContent = name;
        if (i === todayIdx) {
            const tag = document.createElement("span");
            tag.className = "today-tag";
            tag.textContent = "сегодня";
            h.appendChild(tag);
        }
        card.appendChild(h);

        const items = lessonsForDay(i, state.sub, activeHalf);
        if (items.length === 0) {
            const p = document.createElement("div");
            p.style.cssText = "color:var(--text-faint);font-size:13.5px;padding:6px 0;";
            p.textContent = "Занятий нет";
            card.appendChild(p);
        } else {
            const box = document.createElement("div");
            box.className = "glance";
            items.forEach((l, j) => box.appendChild(glanceItem(l, i === todayIdx && slotStatus(l.t, date) === "now", j * 55)));
            card.appendChild(box);
        }
        grid.appendChild(card);
    });
    main.appendChild(grid);
}

function render(animate = true) {
    main.classList.toggle("quiet", !animate);
    renderControls();
    applySettingsPanel();
    renderBadge();
    main.innerHTML = "";

    if (state.view === "week") {
        renderWeek();
        return;
    }
    let date, dayIdx;
    if (state.view === "today") {
        date = TODAY();
        dayIdx = dayIndexFromDate(date);
    } else if (state.view === "tomorrow") {
        date = new Date(TODAY().getTime() + DAY_MS);
        dayIdx = dayIndexFromDate(date);
    } else {
        // выбранный день — берём этот же день текущей недели
        dayIdx = state.view;
        date = new Date(mondayOf(TODAY()).getTime() + dayIdx * DAY_MS);
    }
    renderDay(dayIdx, date);
}

settingsToggle.addEventListener("click", () => {

RATINGS.fetchAll().then(() => render(false));

    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(data => { applyScheduleData(data); })
    .catch(() => {});

setInterval(() => render(false), 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(false); });
